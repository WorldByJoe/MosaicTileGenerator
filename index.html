<meta charset="utf-8">
<title>Mosaic Maker</title>
<style>
  /* ---- theme tokens: warm gallery wall (light) / evening studio (dark) ---- */
  :root{
    --wall:#e9e3d7; --panel:#f6f2e8; --ink:#2e2820; --muted:#877d6d;
    --line:#d6cebe; --accent:#3f7d80; --accent-ink:#ffffff;
    --shadow:0 22px 50px rgba(60,45,25,.38), 0 4px 12px rgba(60,45,25,.22);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --wall:#161310; --panel:#211d16; --ink:#ece5d6; --muted:#9a9082;
      --line:#373126; --accent:#6fb0b2; --accent-ink:#10221f;
      --shadow:0 24px 60px rgba(0,0,0,.6), 0 4px 14px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="light"]{
    --wall:#e9e3d7; --panel:#f6f2e8; --ink:#2e2820; --muted:#877d6d;
    --line:#d6cebe; --accent:#3f7d80; --accent-ink:#ffffff;
    --shadow:0 22px 50px rgba(60,45,25,.38), 0 4px 12px rgba(60,45,25,.22);
  }
  :root[data-theme="dark"]{
    --wall:#161310; --panel:#211d16; --ink:#ece5d6; --muted:#9a9082;
    --line:#373126; --accent:#6fb0b2; --accent-ink:#10221f;
    --shadow:0 24px 60px rgba(0,0,0,.6), 0 4px 14px rgba(0,0,0,.5);
  }

  body{ background:var(--wall); color:var(--ink);
    font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; margin:0; }

  .wall{ padding:40px 28px 26px; }
  .art-frame{ max-width:1500px; margin:0 auto; }
  /* The canvas is bounded on BOTH axes, so a tall artwork scales down to fit the window
     instead of running off the bottom of the page. width/height:auto keeps it proportional. */
  canvas#art{ display:block; margin:0 auto; width:auto; height:auto;
    max-width:100%; max-height:72vh; box-shadow:var(--shadow);
    border:1px solid rgba(0,0,0,.25); background:#241c14; }
  canvas#art.trip{ background:transparent; border:none; box-shadow:none; }  /* wall shows between the three panels */

  .placard{ max-width:1500px; margin:14px auto 0; display:flex; gap:14px;
    align-items:baseline; justify-content:space-between; flex-wrap:wrap; }
  .placard h1 .tag{ display:block; font:italic 400 13px/1.4 Georgia, serif;
    color:var(--muted); letter-spacing:0; margin-top:3px; }
  .placard h1{ font:600 20px/1.2 Georgia, "Iowan Old Style", "Times New Roman", serif;
    margin:0; letter-spacing:.2px; }
  .placard .cat{ color:var(--muted); font-size:13px; font-style:italic;
    font-family:Georgia, serif; }

  .bench{ max-width:1500px; margin:8px auto 60px; }

  /* Square and portrait artworks are short and wide-margined when stacked, which pushes the
     controls far below the image. In those shapes the controls move alongside instead. */
  body.side{ display:grid; grid-template-columns:minmax(0,1fr) 430px;
    gap:0 26px; align-items:start; max-width:1900px; margin:0 auto; }
  body.side .wall{ padding:30px 6px 18px 30px; }
  body.side .bench{ margin:30px 30px 60px 0; max-width:none; }
  body.side canvas#art{ max-height:86vh; }   /* taller: nothing sits underneath it now */
  body.side .art-frame, body.side .placard{ max-width:none; }
  body.side .groups{ grid-template-columns:1fr; }

  /* toolbar reads left to right as the workflow: make → finish → export, with reference on the right */
  .toolbar{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:16px 0 20px; }
  .tbgroup{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .tbgroup + .tbgroup{ margin-left:8px; padding-left:16px; border-left:1px solid var(--line); }
  .tbgroup.right{ margin-left:auto; }
  button{ appearance:none; border:1px solid var(--line); background:var(--panel);
    color:var(--ink); border-radius:6px; padding:9px 16px; font:600 14px system-ui,sans-serif;
    cursor:pointer; }
  button:hover{ border-color:var(--accent); }
  button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  button.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  button.active{ background:var(--ink); border-color:var(--ink); color:var(--wall); }
  button .sub{ display:block; font:400 11px/1.25 system-ui; opacity:.7; margin-top:2px; }
  .tbgroup button:has(.sub){ padding:7px 14px; text-align:left; }
  .seedbox{ display:flex; align-items:center; gap:6px; color:var(--muted); font-size:13px; }
  .seedbox input{ width:90px; border:1px solid var(--line); background:var(--panel);
    color:var(--ink); border-radius:6px; padding:8px; font:14px system-ui; }
  select{ max-width:100%; min-width:0; border:1px solid var(--line); background:var(--panel); color:var(--ink);
    border-radius:6px; padding:8px; font:14px system-ui; }

  .groups{ display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:18px; }
  fieldset{ border:1px solid var(--line); border-radius:10px; background:var(--panel);
    padding:16px 18px 10px; margin:0; }
  legend{ padding:0 8px; font:700 11px/1 system-ui; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted); }
  .ctl{ display:grid; grid-template-columns:16px 1fr 118px; align-items:center;
    gap:8px; padding:7px 0; }
  /* dropdowns carry long option text, so they drop below the label and take the full width */
  .ctl.sel{ grid-template-columns:16px 1fr; }
  .ctl.sel select{ grid-column:2; width:100%; }
  .lk{ padding:0; border:none; background:none; font-size:12px; line-height:1;
    cursor:pointer; opacity:.35; }
  .lk:hover{ border:none; }
  .lk.on{ opacity:1; }
  .ctl label{ font-size:14px; min-width:0; }
  .ctl > *{ min-width:0; }
  .ctl small{ display:block; color:var(--muted); font-size:12px; }
  /* a row whose control is a button has no lock, so it lays out as a plain block */
  .ctl.btnrow{ display:block; border-top:1px solid var(--line); margin-top:8px; padding-top:12px; }
  .ctl.btnrow button{ width:100%; margin-top:7px; font-size:13px; padding:8px; }
  .ctl small b{ float:right; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; }
  input[type=range]{ width:100%; accent-color:var(--accent); }
  [hidden]{ display:none !important; }   /* keep the hidden attribute winning over display rules below */
  #inspo img{ display:block; width:100%; height:auto; box-shadow:var(--shadow);
    border:1px solid rgba(0,0,0,.25); }
  #inspoEmpty{ padding:60px 24px; text-align:center; color:var(--muted);
    background:var(--panel); border:1px dashed var(--line); border-radius:10px; }
  #inspoEmpty p{ margin:0 0 14px; }
  /* Phones and narrow windows: always stack, and leave room for the controls under the art.
     A width query beats sniffing the browser — it also catches small desktop windows. */
  @media (max-width: 820px){
    body.side{ display:block; max-width:none; }
    .wall, body.side .wall{ padding:18px 12px 10px; }
    .bench, body.side .bench{ margin:6px 12px 48px; max-width:none; }
    canvas#art, body.side canvas#art{ max-height:54vh; }
    .groups{ grid-template-columns:1fr; }
    .toolbar{ flex-direction:column; align-items:stretch; }
    .tbgroup{ width:100%; }
    .tbgroup + .tbgroup{ margin-left:0; padding-left:0; border-left:none; }
    .tbgroup.right{ margin-left:0; }
    .tbgroup > *{ flex:1 1 auto; min-width:0; }
    .seedbox{ justify-content:flex-start; }
    .seedbox input{ flex:1 1 auto; min-width:0; width:auto; }
    .placard{ margin-top:10px; }
  }
</style>

<div class="wall">
  <div class="art-frame">
    <canvas id="art"></canvas>
    <div id="inspo" hidden>
      <img id="inspoImg" hidden alt="The original painting that inspired this generator">
      <div id="inspoEmpty">
        <p>Load a photo of the original painting to keep it here for reference.<br>
        It is remembered by this browser afterward.</p>
        <input type="file" id="inspoFile" accept="image/*">
      </div>
    </div>
  </div>
  <div class="placard">
    <h1>Mosaic Maker<span class="tag">mid-century modern mosaics, generated by code</span></h1>
    <span class="cat" id="cat">No. — · mixed pigments on panel</span>
  </div>
</div>

<div class="bench">
  <div class="toolbar">
    <div class="tbgroup">   <!-- ordered most radical to least -->
      <button id="wildBtn">🌀 Surprise me<span class="sub">randomize every setting</span></button>
      <button class="primary" id="newBtn">🎲 New artwork<span class="sub">keep settings, new seed</span></button>
      <button id="recolorBtn">🎨 Repaint colors<span class="sub">keep layout, new colors</span></button>
    </div>
    <div class="tbgroup">                     <!-- take it away -->
      <button id="saveBtn">Download PNG</button>
      <select id="exportRes" aria-label="Export resolution">
        <option value="2000" selected>Screen · 2000 px</option>
        <option value="4000">Print · 4000 px ≈ 13″ @ 300 dpi</option>
        <option value="8000">Print · 8000 px ≈ 27″</option>
        <option value="12000">Print · 12000 px ≈ 40″</option>
      </select>
      <button id="loadBtn" title="Restore the settings stored inside a PNG this page exported">Load settings</button>
      <input type="file" id="metaFile" accept="image/png" hidden>
    </div>
    <div class="tbgroup right">
      <button id="inspoBtn">View inspiration</button>
      <span class="seedbox">seed <input id="seed" type="number" min="1" max="999999" step="1" value="48213"></span>
    </div>
  </div>

  <div class="groups">
    <fieldset>
      <legend>Composition</legend>
      <div class="ctl sel"><label>Canvas shape<small>and the print sizes it fits</small></label>
        <select id="aspect" data-rebuild="1">
          <option value="3" selected>Panorama 3:1 · 12×36″</option>
          <option value="2">Wide 2:1</option>
          <option value="1.78">Screen 16:9</option>
          <option value="1.5">Canvas 3:2 · 20×30″, 24×36″</option>
          <option value="1.33">Classic 4:3 · 18×24″</option>
          <option value="1.27">Canvas 14:11 · 11×14″</option>
          <option value="1.25">Canvas 5:4 · 8×10″, 16×20″</option>
          <option value="1">Square · 8×8″–24×24″</option>
        </select></div>
      <div class="ctl sel"><label>Orientation<small>which way the long side runs</small></label>
        <select id="orient" data-rebuild="1">
          <option value="landscape" selected>Landscape</option>
          <option value="portrait">Portrait</option>
        </select></div>
      <div class="ctl"><label>Vertical panels<small>full-height seams<b id="panelsVal">5</b></small></label>
        <input type="range" id="panels" data-rebuild="1" min="0" max="8" step="1" value="5"></div>
      <div class="ctl"><label>Panel variation<small>0 = all panels equal</small></label>
        <input type="range" id="panelVar" data-rebuild="1" min="0" max="1" step="0.01" value="0"></div>
      <div class="ctl"><label>Split into panels<small>save each panel as its own file</small></label>
        <input type="checkbox" id="split" data-rebuild="1"></div>
      <div class="ctl"><label>Patch size<small>size of each same-size zone</small></label>
        <input type="range" id="patchScale" data-rebuild="1" min="120" max="900" step="10" value="380"></div>
      <div class="ctl"><label>Alignment<small>tidy seams vs. free cuts</small></label>
        <input type="range" id="align" data-rebuild="1" min="0" max="1" step="0.01" value="0.65"></div>
      <div class="ctl"><label>Hexagonal tiling<small>lay a hex grid over the design</small></label>
        <input type="checkbox" id="hexOn" data-rebuild="1"></div>
      <div class="ctl"><label>Hexagon size<small>hex tiling only</small></label>
        <input type="range" id="hexSize" data-rebuild="1" min="5" max="60" step="1" value="16"></div>
      <div class="ctl"><label>Golden ratio<small>φ rectangles only</small></label>
        <input type="checkbox" id="golden" data-rebuild="1"></div>
    </fieldset>

    <fieldset>
      <legend>Tiles</legend>
      <div class="ctl"><label>Smallest tile<small>hard floor</small></label>
        <input type="range" id="minTile" data-rebuild="1" min="6" max="60" step="1" value="13"></div>
      <div class="ctl"><label>Largest tile<small>hard ceiling</small></label>
        <input type="range" id="maxTile" data-rebuild="1" min="40" max="400" step="5" value="170"></div>
      <div class="ctl"><label>Fine coverage<small>area given to small tiles</small></label>
        <input type="range" id="smallFreq" data-rebuild="1" min="0" max="1" step="0.01" value="0.5"></div>
      <div class="ctl"><label>Coarse coverage<small>area kept large</small></label>
        <input type="range" id="bigFreq" data-rebuild="1" min="0" max="1" step="0.01" value="0.5"></div>
      <div class="ctl"><label>Tiny-tile clusters<small>speckled grids of squares</small></label>
        <input type="range" id="burst" data-rebuild="1" min="0" max="1" step="0.01" value="0.45"></div>
      <div class="ctl"><label>Grout<small>dark gap between tiles</small></label>
        <input type="range" id="gap" min="0" max="8" step="0.5" value="3"></div>
      <div class="ctl"><label>Rounded corners<small>squares → pebbles</small></label>
        <input type="range" id="round" min="0" max="1" step="0.01" value="0.06"></div>
      <div class="ctl"><label>Wonkiness<small>corners off-square</small></label>
        <input type="range" id="wonky" min="0" max="1" step="0.01" value="0.25"></div>
      <div class="ctl"><label>Handmade<small>tile tilt, uneven grout</small></label>
        <input type="range" id="handmade" min="0" max="1" step="0.01" value="0.5"></div>
    </fieldset>

    <fieldset>
      <legend>Color</legend>
      <div class="ctl"><label>Teal &amp; blue<small>cool accent tiles</small></label>
        <input type="range" id="cool" min="0" max="3" step="0.05" value="1"></div>
      <div class="ctl"><label>Embers<small>orange &amp; red tiles</small></label>
        <input type="range" id="ember" min="0" max="3" step="0.05" value="1"></div>
      <div class="ctl"><label>Darks<small>black &amp; brown tiles</small></label>
        <input type="range" id="darks" min="0" max="3" step="0.05" value="1"></div>
      <div class="ctl"><label>Color patchiness<small>colors cluster locally</small></label>
        <input type="range" id="colorPatch" min="0" max="1" step="0.01" value="0.55"></div>
      <div class="ctl"><label>Shade variation<small>tile-to-tile wobble</small></label>
        <input type="range" id="jitter" min="0" max="1" step="0.01" value="0.45"></div>
      <div class="ctl"><label>Color runs<small>same-color courses</small></label>
        <input type="range" id="runs" min="0" max="1" step="0.01" value="0.4"></div>
    </fieldset>

    <fieldset>
      <legend>Paint</legend>
      <!-- driven by the button below; hidden so it still travels in PNG metadata -->
      <input type="checkbox" id="flat" checked hidden>
      <div class="ctl"><label>Surface relief<small>how strongly tiles catch the light</small></label>
        <input type="range" id="relief" min="0" max="1" step="0.01" value="0.5"></div>
      <div class="ctl"><label>Aging<small>darkened edges &amp; wash</small></label>
        <input type="range" id="aging" min="0" max="1" step="0.01" value="0.5"></div>
      <div class="ctl"><label>Crazing<small>fine crackle web</small></label>
        <input type="range" id="craze" min="0" max="1" step="0.01" value="0.15"></div>
      <div class="ctl"><label>Canvas weave<small>linen texture</small></label>
        <input type="range" id="weave" min="0" max="1" step="0.01" value="0.35"></div>
      <div class="ctl btnrow"><label>Brush strokes<small>the three settings below apply only with strokes on</small></label>
        <button id="brushBtn">🖌 Add brush strokes</button></div>
      <div class="ctl sel"><label>Stroke<small>how the paint was applied</small></label>
        <select id="stroke">
          <option value="drag" selected>Dragged</option>
          <option value="cross">Cross-hatch</option>
          <option value="scumble">Scumble</option>
          <option value="dabs">Knife dabs</option>
          <option value="smooth">Smooth wash</option>
          <option value="mixed">Mixed</option>
        </select></div>
      <div class="ctl"><label>Viscosity<small>runny paint ↔ thick paint</small></label>
        <input type="range" id="visc" min="0" max="1" step="0.01" value="0.5"></div>
      <div class="ctl"><label>Texture<small>stroke strength &amp; specks</small></label>
        <input type="range" id="brush" min="0" max="1" step="0.01" value="0.6"></div>
    </fieldset>
  </div>
</div>

<script>
'use strict';
/* =============================================================
   Mosaic Maker — recursive-subdivision tile painting generator
   Rules of the algorithm:
   1. A smooth random "detail map" says where tiles should be
      big vs. tiny (zones, not uniform noise). "Smallest/Largest
      tile" bound the sizes; "Fine/Coarse coverage" shape the
      frequency distribution at each end (both high = bimodal).
      "Golden ratio" steers cuts toward φ proportions and snaps
      every drawn tile to an exact golden rectangle.
   2. The canvas is first pre-cut into a few slightly uneven
      full-height vertical panels ("Vertical panels"), like the
      source painting's panel seams; each panel is then cut
      recursively. "Triptych" instead forces three equal panels
      shown with wall gaps and exported as three files. Cuts are often exact halves or thirds
      ("Alignment") so seams line up like real tilework.
      Detailed zones may burst into little uniform grids of
      tiny squares ("Tiny-tile clusters").
   3. Each tile picks a color from a weighted warm palette;
      slow-varying random maps make teal / ember / dark tiles
      cluster in neighborhoods ("Color patchiness"). Two color
      arrangements from the source painting sit on top: some
      burst grids checker two alternating tones, and "Color
      runs" paints same-color courses of small tiles that cut
      horizontally across the panel.
   4. Paint rendering: a physical paint engine. Every stroke
      carries the tile's own pigment with a bristle body, a cast
      shadow and a ridge catch-light, all lit from the upper
      left; brush widths are quantized (three brushes for the
      whole painting); "Viscosity" sets ridge height, opacity
      and wander. Stroke patterns: dragged / cross-hatch /
      scumble / knife dabs / smooth wash / mixed. Each tile edge
      gets the same directional relief, and "Canvas weave" lays
      a linen ground over everything. Plus rim pooling, specks,
      optional crazing. The "Handmade"
      slider adds hand-set irregularity: tile tilt, uneven
      grout width, and mottled grout color. "Rounded corners"
      and "Wonkiness" reshape each tile from crisp rectangle
      toward pebble / off-square quad (geometry-seeded, so
      repaint never moves them).
   All randomness flows from the seed: the layout, the colors,
   and the brushwork each get their own stream. "Repaint colors"
   keeps the layout and deterministically re-pigments it as
   variant .1, .2, ... — the placard "No. seed.variant" fully
   identifies any artwork.
   ============================================================= */

/* ---------- seeded randomness ---------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
function ihash(x,y,s){ let h=Math.imul(x|0,0x27d4eb2d)^Math.imul(y|0,0x165667b1)^Math.imul(s|0,0x9e3779b9);
  h=Math.imul(h^(h>>>15),0x85ebca6b); h=Math.imul(h^(h>>>13),0xc2b2ae35); h^=h>>>16;
  return (h>>>0); }
/* value noise in [0,1], smooth zones used for the detail & color maps */
function vnoise(x,y,s){ const ix=Math.floor(x), iy=Math.floor(y), fx=x-ix, fy=y-iy;
  const a=ihash(ix,iy,s)/4294967296, b=ihash(ix+1,iy,s)/4294967296,
        c=ihash(ix,iy+1,s)/4294967296, d=ihash(ix+1,iy+1,s)/4294967296;
  const ux=fx*fx*(3-2*fx), uy=fy*fy*(3-2*fy);
  return a+(b-a)*ux+(c-a)*uy+(a-b-c+d)*ux*uy; }
function fbm(x,y,s){ return 0.65*vnoise(x,y,s)+0.35*vnoise(x*2.7+13.1,y*2.7+7.7,s^0x51ab); }
const clamp=(v,lo,hi)=>Math.min(hi,Math.max(lo,v));
/* colors travel as {h,s,l} so the paint engine can mix tints from each tile's pigment */
const hslCss=(o,dl=0,ds=0,dh=0)=>`hsl(${(o.h+dh).toFixed(1)} ${clamp(o.s+ds,3,88).toFixed(1)}% ${clamp(o.l+dl,2,96).toFixed(1)}%)`;

/* ---------- mechanical paint engine: pigment math, bristle footprints, relief ---------- */
function hsl2rgb(h,s,l){ h=((h%360)+360)%360; s/=100; l/=100;
  const a=s*Math.min(l,1-l),
        f=n=>{ const k=(n+h/30)%12; return l-a*Math.max(-1,Math.min(k-3,9-k,1)); };
  return [f(0),f(8),f(4)]; }
/* pseudo-Kubelka-Munk mix: lerp in gamma-2.2 space so yellow+blue drifts green, not gray */
function mixP(a,b,t){ const g=2.2;
  return [0,1,2].map(i=>Math.pow((1-t)*Math.pow(a[i],g)+t*Math.pow(b[i],g),1/g)); }
/* bristle footprint cache: masks pre-rendered at DEVICE resolution (qw*S px), drawn at
   logical size under the scaled CTM so print export stays sharp. Keyed on quantized
   width + load state + S; own seeded rng per key => deterministic whatever build order. */
const FPC=new Map(), TNT=new Map(); let FPS=1, FPID=0;
/* Start every pass with empty caches. Logically the keys already encode everything, but a
   cached mask canvas that the browser has already rasterized gets scaled on draw slightly
   differently from a freshly built one, so a warm cache makes the SAME settings paint a
   subtly different picture. Reproducibility is the contract here (exports carry their
   recipe), so the few dozen small masks are rebuilt per pass — cost is negligible. */
function setFPScale(S){ FPS=S; FPC.clear(); TNT.clear(); }
function getFP(wd,state,S){            // state: 0 full brush, 1 half load, 2 dry, 3 wash pad
  const qw=Math.max(1.5,Math.round(wd*2)/2), key=qw+'|'+state+'|'+S;
  let fp=FPC.get(key); if(fp) return fp;
  const d2=Math.max(2,Math.ceil(qw*S));
  fp=document.createElement('canvas'); fp.width=fp.height=d2; fp._id=FPID++;
  const g2=fp.getContext('2d'), fr=mulberry32(ihash(Math.round(qw*2),state,0xF00D));
  if(state===3){                       // thin paint LEVELS as it dries: a soft pad, no bristle marks
    const rg2=g2.createRadialGradient(d2/2,d2/2,0,d2/2,d2/2,d2/2);
    rg2.addColorStop(0,'rgba(255,255,255,0.85)');
    rg2.addColorStop(0.5,'rgba(255,255,255,0.45)');
    rg2.addColorStop(1,'rgba(255,255,255,0)');
    g2.fillStyle=rg2; g2.fillRect(0,0,d2,d2);
    if(FPC.size>600) FPC.clear();
    FPC.set(key,fp); return fp;
  }
  const Nb=Math.max(3,Math.round(qw*1.4*[1,0.6,0.28][state]));  // bristles thin out as the brush dries
  g2.fillStyle='#fff';
  for(let b3=0;b3<Nb;b3++){
    const r3=Math.pow(fr(),0.6)*d2*0.5, a3=fr()*6.2832;         // pow .6 centre-loads the disc
    const bx=d2/2+r3*Math.cos(a3), by=d2/2+r3*Math.sin(a3);
    g2.globalAlpha=(state===2?0.35:0.25)+fr()*0.55;             // per-bristle alpha variation
    if(state===2) g2.fillRect(bx-d2*0.18,by-0.6*S,d2*0.36,Math.max(1,1.2*S)); // dry: streaky flecks
    else{ g2.beginPath(); g2.arc(bx,by,(0.5+fr()*qw*0.08)*S,0,6.2832); g2.fill(); }
  }
  if(FPC.size>600) FPC.clear();    // memory bound; entries rebuild deterministically on demand
  FPC.set(key,fp); return fp;
}
/* tint a mask with the running brush colour: fill + destination-in on an unscaled scratch
   (CTM-independent). Colour quantized to 32 levels so the cache stays tiny. */
function tintFP(fp,rgb){
  const key=fp._id+'|'+rgb.map(v=>Math.round(v*31)).join(',');
  let t=TNT.get(key); if(t) return t;
  if(TNT.size>400) TNT.clear();
  t=document.createElement('canvas'); t.width=fp.width; t.height=fp.height;
  const g2=t.getContext('2d');
  g2.fillStyle=`rgb(${Math.round(rgb[0]*255)},${Math.round(rgb[1]*255)},${Math.round(rgb[2]*255)})`;
  g2.fillRect(0,0,t.width,t.height);
  g2.globalCompositeOperation='destination-in'; g2.drawImage(fp,0,0);
  TNT.set(key,t); return t;
}
/* raking light over the accumulated height field. Highlight = height minus itself shifted
   toward the light (destination-out on alpha), tinted, composited. drawImage-only: no
   getImageData (a 12000px export field is huge), no ctx.filter / shadow* (Safari + CTM-unsafe).
   Offsets are DEVICE px composited under identity => relief scales with print size. */
function applyRelief(c,hc,p){
  if(hc.width*hc.height>1.5e8) return;                  // huge-square-export insurance (Safari canvas caps)
  const S=c.getTransform().a, d=(0.55+1.4*p.relief)*S;
  const sc=document.createElement('canvas'); sc.width=hc.width; sc.height=hc.height;
  const g2=sc.getContext('2d');
  const pass2=(dx,dy,tint,gco,ga)=>{
    g2.clearRect(0,0,sc.width,sc.height);
    g2.globalCompositeOperation='source-over';      g2.drawImage(hc,0,0);
    g2.globalCompositeOperation='destination-out';  g2.drawImage(hc,dx,dy);
    g2.globalCompositeOperation='source-in';        g2.fillStyle=tint; g2.fillRect(0,0,sc.width,sc.height);
    c.save(); c.setTransform(1,0,0,1,0,0);          // device space: d already carries S
    c.globalCompositeOperation=gco; c.globalAlpha=ga; c.drawImage(sc,0,0); c.restore();
  };
  const k=0.25+0.72*p.relief;                           // lighting strength
  pass2( d, d,'rgb(255,247,228)','screen',   0.42*k);   // NW-facing crests catch the light
  pass2(-d,-d,'rgb(28,17,8)',   'multiply', 0.30*k);    // SE-facing sides fall into shadow (kept
                                                        // under the highlight so relief adds no net tint)
  sc.width=sc.height=0;                                 // drop the scratch backing store eagerly (Safari memory accounting)
}

/* ---------- rule 1+2: recursive subdivision guided by the detail map ---------- */
/* ---------- hexagonal overlay ------------------------------------------------
   The rectangle subdivision above stays exactly as it is and becomes the COLOUR
   SOURCE. A uniform hex lattice is then laid over it and each hexagon adopts the
   colour of whichever rectangle sits under its centre — so a big calm rectangle
   turns into a solid patch of hexagons and the fine speckle varies hex by hex.
   The hex grid is a resampling filter over the design, not a new design. ------- */
function polyMetrics(P){
  let a=0,cx=0,cy=0;
  for(let i=0;i<P.length;i++){ const j=(i+1)%P.length;
    const f=P[i][0]*P[j][1]-P[j][0]*P[i][1];
    a+=f; cx+=(P[i][0]+P[j][0])*f; cy+=(P[i][1]+P[j][1])*f; }
  a*=0.5;
  if(Math.abs(a)<1e-9){ let sx=0,sy=0; P.forEach(v=>{sx+=v[0];sy+=v[1];});
    return {cx:sx/P.length,cy:sy/P.length,area:0,ang:0,ext:1,sh:1}; }
  cx/=6*a; cy/=6*a;
  let sxx=0,syy=0,sxy=0;
  for(const v of P){ const dx=v[0]-cx, dy=v[1]-cy; sxx+=dx*dx; syy+=dy*dy; sxy+=dx*dy; }
  const ang=0.5*Math.atan2(2*sxy,sxx-syy), ca=Math.cos(ang), sa=Math.sin(ang);
  let u0=-1e9,u1=1e9,v0=-1e9,v1=1e9;
  for(const v of P){ const dx=v[0]-cx, dy=v[1]-cy;
    const u=dx*ca+dy*sa, w2=-dx*sa+dy*ca;
    u0=Math.max(u0,u); u1=Math.min(u1,u); v0=Math.max(v0,w2); v1=Math.min(v1,w2); }
  return {cx,cy,area:Math.abs(a),ang,ext:Math.max(1,u0-u1),sh:Math.max(1,v0-v1)};
}
/* keep the half-plane on one side of a line — used to cut hexagons at a panel seam */
function clipHalf(P,mx,my,nx,ny){
  const side=v=>(v[0]-mx)*nx+(v[1]-my)*ny, out=[];
  for(let i=0;i<P.length;i++){
    const a=P[i], b=P[(i+1)%P.length], sa=side(a), sb=side(b);
    if(sa<=0) out.push(a);
    if((sa<0&&sb>0)||(sa>0&&sb<0)){ const t=sa/(sa-sb);
      out.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]); }
  }
  return out;
}
/* pull every edge inward by d so the grout is even all the way round the shape */
function insetPoly(P,cx,cy,d){
  const n=P.length, L=[];
  for(let i=0;i<n;i++){
    const a=P[i], b=P[(i+1)%n];
    let dx=b[0]-a[0], dy=b[1]-a[1];
    const len=Math.hypot(dx,dy)||1; dx/=len; dy/=len;
    let nx=-dy, ny=dx;
    const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
    if((cx-mx)*nx+(cy-my)*ny<0){ nx=-nx; ny=-ny; }
    L.push([a[0]+nx*d, a[1]+ny*d, dx, dy]);
  }
  const out=[];
  for(let i=0;i<n;i++){
    const q=L[(i-1+n)%n], r=L[i];
    const den=q[2]*r[3]-q[3]*r[2];
    if(Math.abs(den)<1e-6){ out.push([r[0],r[1]]); continue; }
    const t=((r[0]-q[0])*r[3]-(r[1]-q[1])*r[2])/den;
    out.push([q[0]+q[2]*t, q[1]+q[3]*t]);
  }
  return out;
}
/* the panel seam positions, replaying exactly the draws buildTiles makes for them,
   so hexagons can be kept from straddling a seam and blurring it */
function panelXs(W,p){
  if(p.panels<2) return [0,W];
  const rng=mulberry32(ihash(seed,11,977)), wts=[]; let tot=0;
  for(let k=0;k<p.panels;k++){ const v=1+0.7*p.panelVar*(rng()-0.5); wts.push(v); tot+=v; }
  const e=[0]; let px=0;
  for(let k=0;k<p.panels;k++){ px+=W*wts[k]/tot; e.push(px); }
  return e;
}
function hexOverlay(W,H,p,rects){
  const s=Math.max(5,p.hexSize);
  // bucket the rectangles into a coarse grid so each hex centre can find its colour fast
  const CELL=6, gw=Math.ceil(W/CELL)+1, gh=Math.ceil(H/CELL)+1;
  const idx=new Int32Array(gw*gh).fill(-1);
  for(let i=0;i<rects.length;i++){ const r=rects[i];
    const x0=Math.max(0,Math.floor(r.x/CELL)), x1=Math.min(gw-1,Math.floor((r.x+r.w)/CELL));
    const y0=Math.max(0,Math.floor(r.y/CELL)), y1=Math.min(gh-1,Math.floor((r.y+r.h)/CELL));
    for(let gy=y0;gy<=y1;gy++) for(let gx=x0;gx<=x1;gx++) idx[gy*gw+gx]=i;
  }
  const srcAt=(x,y)=>{
    const gx=clamp(Math.floor(x/CELL),0,gw-1), gy=clamp(Math.floor(y/CELL),0,gh-1);
    let v=idx[gy*gw+gx];
    for(let r=1;v<0&&r<=4;r++){                          // panel insets leave thin uncovered strips
      for(let dy=-r;dy<=r&&v<0;dy++) for(let dx=-r;dx<=r&&v<0;dx++){
        const qx=gx+dx, qy=gy+dy;
        if(qx<0||qy<0||qx>=gw||qy>=gh) continue;
        v=idx[qy*gw+qx];
      }
    }
    return v;
  };
  const E=panelXs(W,p);
  const panelOf=x=>{ let k=0; while(k<E.length-2 && x>=E[k+1]) k++; return k; };
  const stepX=s*Math.sqrt(3), stepY=s*1.5;              // pointy-top rows
  const out=[];
  const ny=Math.ceil(H/stepY)+2, nx=Math.ceil(W/stepX)+2;
  for(let j=-1;j<ny;j++){
    for(let i=-1;i<nx;i++){
      const cx=i*stepX+((j&1)?stepX/2:0), cy=j*stepY;
      if(cx<-s||cx>W+s||cy<-s||cy>H+s) continue;
      const si=srcAt(cx,cy); if(si<0) continue;
      let V=[];
      for(let k=0;k<6;k++){ const a=(Math.PI/180)*(60*k+30);
        V.push([cx+s*Math.cos(a), cy+s*Math.sin(a)]); }
      if(E.length>2){                                    // cut at the seam, don't squash onto it
        const pk=panelOf(cx), Lx=E[pk]+0.75, Rx=E[pk+1]-0.75;
        if(Rx-Lx<3) continue;
        V=clipHalf(V,Lx,0,-1,0);
        if(V.length>=3) V=clipHalf(V,Rx,0,1,0);
        if(V.length<3) continue;
      }
      const m=polyMetrics(V);
      if(m.area < s*s*0.10) continue;                     // drop seam slivers rather than paint them
      out.push({poly:V,cx:m.cx,cy:m.cy,area:m.area,ang:m.ang,ext:m.ext,sh:m.sh,
                src:rects[si],si:si});
    }
  }
  return out;
}
function buildTiles(W,H,p){
  const rng=mulberry32(ihash(seed,11,977));
  const out=[]; const stack=[];
  const PHI=1.618034;
  if(p.panels>=2){
    // uneven full-height panels; small inset widens their seams beyond ordinary grout
    const wts=[]; let tot=0;
    for(let k=0;k<p.panels;k++){ const v=1+0.7*p.panelVar*(rng()-0.5); wts.push(v); tot+=v; }
    let px=0;
    for(let k=0;k<p.panels;k++){ const pw=W*wts[k]/tot;
      stack.push({x:px+1.5,y:0,w:pw-3,h:H}); px+=pw; }
  } else stack.push({x:0,y:0,w:W,h:H});
  const maxT=Math.max(p.maxTile,p.minTile*1.6), minT=Math.max(6,Math.min(p.minTile,maxT/1.5));
  const emitG=(r)=>{                                     // golden mode: split far-from-φ leaves into near-φ strips
    if(!p.golden){ out.push(r); return; }                //   (else the draw-time snap would leave bare-grout voids)
    const vert=r.w>=r.h, L=vert?r.w:r.h, C=vert?r.h:r.w;
    let n=Math.max(1,Math.round(L/(C*PHI)));
    if(n===1 && L/C<Math.SQRT2) n=2;                     // near-square: two slim halves beat one 38% crop
    for(let q=0;q<n;q++) out.push(vert? {x:r.x+L*q/n,y:r.y,w:L/n,h:r.h}
                                      : {x:r.x,y:r.y+L*q/n,w:r.w,h:L/n});
  };
  let guard=0;
  while(stack.length && out.length<30000 && guard++<250000){
    const r=stack.pop();
    const cx=r.x+r.w/2, cy=r.y+r.h/2;
    let d=fbm(cx/p.patchScale, cy/p.patchScale, seed);
    // Fine/Coarse coverage shape the size distribution: their sum sets the spread
    // (both high = bimodal tiny+huge), their difference biases small vs large
    d=clamp(0.5+(d-0.5)*(0.7+1.1*(p.smallFreq+p.bigFreq))+0.45*(p.smallFreq-p.bigFreq), 0, 1);
    const target=maxT*Math.pow(minT/maxT, d);        // local tile size the zone wants
    const maxDim=Math.max(r.w,r.h);
    const canSplit=maxDim>Math.max(2*minT,target);
    if(!p.golden && canSplit && maxDim<target*3.2 && rng()<0.06){ out.push(r); continue; } // rare big feature tile (off in golden mode: odd aspects crop badly)
    if(!canSplit){
      // detailed zones sometimes burst into a neat grid of tiny squares
      if(d>0.5 && rng()<p.burst && r.w>18 && r.h>18){
        const cell=Math.max(6,minT);
        // floor() + fall-through: burst cells never dip below the Smallest-tile floor
        let cols=clamp(Math.floor(r.w/cell),1,14), rows=clamp(Math.floor(r.h/cell),1,14);
        if(p.golden){                                    // golden cells must fit at least twice per axis
          rows=clamp(Math.floor(r.h/cell),1,14);
          cols=rows>1? Math.min(14,Math.round(r.w/((r.h/rows)*PHI))):0;
        }
        if(cols>1 && rows>1 && cols*rows>3){
          const cw=r.w/cols, ch=r.h/rows, gid=out.length;  // gid tags this grid so coloring can checker it
          for(let i=0;i<cols;i++) for(let j=0;j<rows;j++)
            out.push({x:r.x+i*cw,y:r.y+j*ch,w:cw,h:ch,gid:gid,par:(i+j)&1});
          continue;
        }
      }
      emitG(r); continue;
    }
    // cut the long way; "Alignment" prefers exact halves/thirds so seams line up
    let vert=r.w>r.h;
    if(!p.golden && Math.abs(r.w-r.h)<0.15*maxDim && Math.min(r.w,r.h)>2*minT && rng()<0.5) vert=!vert;
    const L=vert?r.w:r.h, C=vert?r.h:r.w;
    let cuts;
    if(p.golden){
      // aim children at golden proportions: child length ≈ φ×cross (or cross/φ for slim courses)
      let k=Math.round(L/(C*PHI));
      if(k<2) k=Math.max(2,Math.round(L*PHI/C));
      k=Math.max(2,Math.min(k,6,Math.floor(L/minT)||2));
      cuts=[]; for(let q=1;q<k;q++) cuts.push(L*q/k);
    }
    else if(rng()<p.align){ const parts=(rng()<0.7||L<3*minT)?2:3; cuts=[];
      for(let k=1;k<parts;k++) cuts.push(L*k/parts); }
    else cuts=[L*clamp(0.33+0.34*rng(), minT/L, 1-minT/L)];  // both pieces stay >= the floor
    let prev=0;
    for(const c of cuts.concat([L])){
      stack.push(vert? {x:r.x+prev,y:r.y,w:c-prev,h:r.h}
                     : {x:r.x,y:r.y+prev,w:r.w,h:c-prev});
      prev=c;
    }
  }
  while(stack.length) emitG(stack.pop());     // cap reached: emit leftovers as coarse tiles, never holes
  return p.hexOn? hexOverlay(W,H,p,out) : out;
}

/* ---------- rule 3: weighted palette with neighborhood clustering ---------- */
function pickColor(t,i,p,rr){
  const cx=t.x+t.w/2, cy=t.y+t.h/2, cs=430;
  const jit=(m,hj,sj,lj)=>({ h:m[0]+(rr()-0.5)*hj,
    s:clamp(m[1]+(rr()-0.5)*sj,5,75), l:clamp(m[2]+(rr()-0.5)*lj,4,94) });
  // some burst grids checker two alternating tones (the dotted speckle in the source painting)
  if(t.gid!==undefined && ihash(t.gid,3,colorSeed)/4294967296<0.5){
    const PAIRS=[[[46,34,90],[26,16,10]],[[46,34,90],[185,28,48]],
                 [[46,34,90],[17,62,46]],[[44,56,58],[26,16,10]]];
    const pr=PAIRS[ihash(t.gid,5,colorSeed)%PAIRS.length];
    return jit(pr[t.par],4,18*p.jitter,19*p.jitter);
  }
  // color runs: same-color courses of small tiles cutting horizontally across the panel
  // (fixed-pixel gate, matched to the 34px band, so big feature tiles never join a run)
  if(p.runs>0.01 && t.h<40 && t.w<60){
    const band=Math.round(cy/34), seg=Math.floor(cx/360);
    if(ihash(band,seg,colorSeed^0x77)/4294967296 < 0.55*p.runs){
      const v=ihash(band,seg,colorSeed^0x88)/4294967296;
      const m= v<0.35?[46,36,90] : v<0.55?[44,58,58] : v<0.75?[183,28,50]
             : v<0.9 ?[19,62,46] : [26,18,10];
      return jit(m,3,10*p.jitter,15*p.jitter);
    }
  }
  const fCool =fbm(cx/cs,cy/cs,colorSeed^0x11);
  const fEmber=fbm(cx/cs+53,cy/cs,colorSeed^0x22);
  const fDark =fbm(cx/cs,cy/cs+53,colorSeed^0x33);
  const fLight=fbm(cx/cs+99,cy/cs+99,colorSeed^0x44);
  const st=2.8*p.colorPatch;
  const f=v=>Math.pow(Math.max(0.05,2*v),st);        // cluster multiplier from a slow map
  const w={
    light:BASEW.light*Math.pow(Math.max(0.05,2*fLight),st*0.5),
    yellow:BASEW.yellow*Math.pow(Math.max(0.05,2*fLight),st*0.3),
    ochre:BASEW.ochre,
    ember:BASEW.ember*p.ember*f(fEmber),
    teal:BASEW.teal*p.cool*f(fCool),
    olive:BASEW.olive,
    brown:BASEW.brown*p.darks*Math.pow(Math.max(0.05,2*fDark),st*0.6),
    dark:BASEW.dark*p.darks*f(fDark) };
  // little tiles skew to punchy accents; big tiles skew warm & pale
  const a=t.w*t.h;
  if(a<26*26){ w.dark*=1.7; w.teal*=1.5; w.ember*=1.35; }
  if(a>120*120){ w.light*=1.6; w.yellow*=1.3; w.dark*=0.6; }
  let tot=0; for(const g in w) tot+=w[g];
  let x=rr()*tot, group='light';
  for(const g in w){ if((x-=w[g])<=0){ group=g; break; } }
  const m=PAL[group][Math.floor(rr()*PAL[group].length)];
  return { h:m[0]+(rr()-0.5)*6,
           s:clamp(m[1]+(rr()-0.5)*14*p.jitter,5,75),
           l:clamp(m[2]+(rr()-0.5)*24*p.jitter,4,94) };
}

/* ---------- rule 4: paint the tiles ---------- */
function paintGround(c,p){
  c.fillStyle='#241c14'; c.fillRect(0,0,curW,curH);       // grout ground
  if(p.handmade>0.02){                                    // mottled grout: warm/dark patches show in the gaps
    const gm=mulberry32(ihash(9,17,colorSeed));
    for(let gy=0;gy<curH;gy+=64) for(let gx=0;gx<curW;gx+=64){
      const wmt=gm(), al=(0.20*p.handmade*gm()).toFixed(3);
      c.fillStyle=`rgba(${Math.round(40+34*wmt)},${Math.round(26+20*wmt)},${Math.round(12+10*wmt)},${al})`;
      c.fillRect(gx,gy,64,64);
    }
  }
}
function drawTile(sf,p,i){     // one tile, fully self-contained: every stream is keyed on i
  const {c,hctx,S}=sf;         // colour canvas, shared height field, device scale
  const tilePath=(g,P,r)=>{                              // rounded polygon: quad or hexagon
    const n=P.length, mid=(u,v)=>[(u[0]+v[0])/2,(u[1]+v[1])/2];
    g.beginPath();
    const m0=mid(P[0],P[1]); g.moveTo(m0[0],m0[1]);
    for(let k=1;k<=n;k++){ const cp=P[k%n], nx=mid(P[k%n],P[(k+1)%n]);
      g.arcTo(cp[0],cp[1],nx[0],nx[1],r); }
    g.closePath(); };
    const t=tiles[i];
    const ci= t.si!==undefined? t.si : i;                 // hexes inherit their source rectangle's colour,
    const rr=mulberry32(ihash(ci,1013,colorSeed));       // so every hex over one rectangle matches

    livePass=paintChunked(ctx,p);   // paints progressively onto the visible canvas
  }
  $('cat').textContent=`No. ${seed}${paintNo?'.'+paintNo:''} · mixed pigments on panel${splitting?` · ${panelXs(curW,p).length-1} panels`:''} · ${curW} × ${curH}px · ${tiles.length} tiles`;
}

function rebuild(){
  const p=params();
  // portrait keeps the LONG side at the canvas resolution, so both orientations cost the same
  if(p.portrait){ curH=CANVAS_W; curW=Math.round(CANVAS_W/p.aspect); }
  else{ curW=CANVAS_W; curH=Math.round(CANVAS_W/p.aspect); }
  tiles=buildTiles(curW,curH,p);
  render();
}

/* ---------- wiring ---------- */
let pending=null, pendingRebuild=false;
function schedule(needRebuild){
  pendingRebuild=pendingRebuild||needRebuild;      // never let a paint tweak cancel a queued rebuild
  if(pending) cancelAnimationFrame(pending);
  pending=requestAnimationFrame(()=>{
    const doRebuild=pendingRebuild;
    pending=null; pendingRebuild=false;
    doRebuild? rebuild():render();
  });
}
document.querySelectorAll('input[type=range], input[type=checkbox], #aspect, #stroke, #orient').forEach(el=>{
  el.addEventListener('input',()=>schedule(!!el.dataset.rebuild));
});
const syncPanels=()=>{ const n=parseInt($('panels').value,10);
  $('panelsVal').textContent= n<2? 'off' : n; };
$('panels').addEventListener('input',syncPanels);
$('seed').addEventListener('change',()=>{
  const v=parseInt($('seed').value,10);
  if(Number.isFinite(v) && v>0){ seed=v; paintNo=0; colorSeed=seed*7+3; rebuild(); }
});
$('newBtn').addEventListener('click',()=>{
  seed=1+Math.floor(Math.random()*999998);
  paintNo=0; colorSeed=seed*7+3; $('seed').value=seed;
  $('flat').checked=true; syncBrush();     // explore designs instantly; add strokes when you like one
  rebuild();
});
/* Brushwork is a separate, final step: exploring designs stays instant, and adding strokes
   repaints the SAME tiles and colours — layout and pigment never move. */
function syncBrush(){
  const off=$('flat').checked;
  $('brushBtn').textContent= off? '🖌 Add brush strokes' : '🖌 Brush strokes on';
  $('brushBtn').classList.toggle('active',!off);
}
$('brushBtn').addEventListener('click',()=>{
  $('flat').checked=!$('flat').checked;
  syncBrush(); render();          // render(), not rebuild(): the design is already decided
});
$('recolorBtn').addEventListener('click',()=>{
  // deterministic variant: No. seed.k is reproducible (enter seed, click Repaint k times)
  paintNo++; colorSeed=ihash(seed,paintNo,0x5eed); render();
});
/* per-control locks: a locked control is skipped by Surprise me */
const LOCKS=new Set();
document.querySelectorAll('.ctl').forEach(ctl=>{
  const inp=ctl.querySelector('input,select'); if(!inp||!inp.id) return;
  const b=document.createElement('button');
  b.className='lk'; b.type='button'; b.textContent='🔓';
  b.title='Lock this setting so Surprise me leaves it alone';
  b.addEventListener('click',()=>{
    const on=!LOCKS.has(inp.id);
    if(on) LOCKS.add(inp.id); else LOCKS.delete(inp.id);
    b.textContent=on?'🔒':'🔓'; b.classList.toggle('on',on);
  });
  ctl.insertBefore(b,ctl.firstChild);
});
$('wildBtn').addEventListener('click',()=>{
  // randomize every unlocked slider (canvas shape stays put), then roll a fresh seed
  const R=(id,lo,hi,dec)=>{ if(LOCKS.has(id)) return;
    $(id).value=(lo+Math.random()*(hi-lo)).toFixed(dec??2); };
  R('minTile',6,40,0); R('maxTile',60,400,0); R('smallFreq',0,1); R('bigFreq',0,1);
  if(!LOCKS.has('golden')) $('golden').checked=Math.random()<0.15;
  if(!LOCKS.has('stroke'))
    $('stroke').value=['drag','cross','scumble','dabs','smooth','mixed'][Math.floor(Math.random()*6)];
  R('visc',0,1); R('patchScale',120,900,0);
  R('burst',0,1); R('align',0,1);
  if(!LOCKS.has('panels')) $('panels').value=Math.floor(Math.random()*9);
  R('gap',0.5,6,1);
  R('cool',0,2.2); R('ember',0,2.2); R('darks',0,2.2); R('colorPatch',0,1);
  R('jitter',0,1); R('runs',0,1);
  R('brush',0,1); R('aging',0,1); R('craze',0,0.6); R('weave',0.1,0.7); // tasteful caps: full-max
  R('handmade',0,1); R('round',0,0.7); R('wonky',0,0.8); R('hexSize',9,34,0); R('panelVar',0,0.5); R('relief',0.15,0.85);  // extremes stay manual-only
  seed=1+Math.floor(Math.random()*999998);
  paintNo=0; colorSeed=seed*7+3; $('seed').value=seed;
  $('flat').checked=true; syncBrush();     // instant surprise: strokes are added on request
  rebuild();
});
/* ---- inspiration viewer: shows the original painting this GUI was built from ---- */
const INSPIRATION_SRC=''; // the original painting, embedded
const INSPO_KEY='mosaic_inspiration';
let inspoOpen=false, savedCat='';
function showInspoImg(src){ $('inspoImg').src=src; $('inspoImg').hidden=false; $('inspoEmpty').hidden=true; }
if(INSPIRATION_SRC) showInspoImg(INSPIRATION_SRC);
else{ try{ const d=localStorage.getItem(INSPO_KEY); if(d) showInspoImg(d); }catch(e){} }

  const f=ev.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ showInspoImg(rd.result);
    try{ localStorage.setItem(INSPO_KEY,rd.result); }catch(e){} };

$('inspoBtn').addEventListener('click',()=>{
  inspoOpen=!inspoOpen;
  $('inspo').hidden=!inspoOpen;
  canvas.style.display=inspoOpen?'none':'block';
  $('inspoBtn').textContent=inspoOpen?'Hide inspiration':'View inspiration';
  $('inspoBtn').classList.toggle('active',inspoOpen);
  if(inspoOpen){ savedCat=$('cat').textContent;
    $('cat').textContent='The original painting · the inspiration for this generator'; }
  else $('cat').textContent=savedCat;
});
/* ---- PNG recipe metadata -------------------------------------------------
   Every export carries its own settings in a standard PNG tEXt chunk, so any
   file can be reproduced later. Image viewers ignore the chunk; copying or
   emailing the file keeps it (re-encoding elsewhere, e.g. a screenshot, loses
   it, as does any tool that strips metadata). ------------------------------ */
const CRCT=(()=>{ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; }
  return t; })();
function crc32(buf,start,end){ let c=0xFFFFFFFF;
  for(let i=start;i<end;i++) c=CRCT[(c^buf[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0; }
function pngAddText(bytes,key,val){
  const pay=[];                                        // tEXt payload: keyword \0 latin-1 text
  for(const ch of key) pay.push(ch.charCodeAt(0)&0xFF);
  pay.push(0);
  for(const ch of val) pay.push(ch.charCodeAt(0)&0xFF);
  const len=pay.length, chunk=new Uint8Array(12+len), dv=new DataView(chunk.buffer);
  dv.setUint32(0,len);
  chunk[4]=0x74; chunk[5]=0x45; chunk[6]=0x58; chunk[7]=0x74;   // 'tEXt'
  chunk.set(pay,8);
  dv.setUint32(8+len,crc32(chunk,4,8+len));
  const at=33;                                         // 8-byte signature + the whole IHDR chunk
  const out=new Uint8Array(bytes.length+chunk.length);
  out.set(bytes.subarray(0,at),0); out.set(chunk,at); out.set(bytes.subarray(at),at+chunk.length);
  return out;
}
function pngGetText(bytes,key){
  let off=8;                                           // walk the chunk list past the signature
  const dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
  while(off+8<=bytes.length){
    const len=dv.getUint32(off);
    const type=String.fromCharCode(bytes[off+4],bytes[off+5],bytes[off+6],bytes[off+7]);
    if(type==='tEXt'){
      let s=''; for(let i=off+8;i<off+8+len;i++) s+=String.fromCharCode(bytes[i]);
      const z=s.indexOf('\0');
      if(z>0 && s.slice(0,z)===key) return s.slice(z+1);
    }
    if(type==='IEND') break;
    off+=12+len;
  }
  return null;
}
const META_KEY='MosaicMaker';
function settingsJSON(){                               // every control that shapes the artwork
  const o={v:1,seed:seed,paintNo:paintNo};
  document.querySelectorAll('input,select').forEach(el=>{
    if(!el.id || el.id==='seed' || el.type==='file') return;
    o[el.id]= el.type==='checkbox'? el.checked : el.value;
  });
  return JSON.stringify(o);
}
function applySettings(o){
  Object.keys(o).forEach(k=>{
    if(k==='v'||k==='seed'||k==='paintNo') return;
    const el=document.getElementById(k); if(!el) return;
    if(el.type==='checkbox') el.checked=!!o[k]; else el.value=o[k];
  });
  if(Number.isFinite(o.seed)){ seed=o.seed; $('seed').value=seed; }
  paintNo=Number.isFinite(o.paintNo)? o.paintNo : 0;
  colorSeed= paintNo? ihash(seed,paintNo,0x5eed) : seed*7+3;   // matches the Repaint variant chain
  syncBrush();
  rebuild();
}
$('loadBtn').addEventListener('click',()=>$('metaFile').click());
$('metaFile').addEventListener('change',ev=>{
  const f=ev.target.files[0]; ev.target.value='';
  if(!f) return;
  f.arrayBuffer().then(ab=>{
    const txt=pngGetText(new Uint8Array(ab),META_KEY);
    if(!txt){ alert('No Mosaic Maker settings in that PNG — only files exported by this page carry their recipe.'); return; }
    try{ applySettings(JSON.parse(txt)); }
    catch(e){ alert('That PNG carries settings this version cannot read.'); }
  }).catch(()=>alert('That file could not be read.'));
});
$('saveBtn').addEventListener('click',()=>{
  const btn=$('saveBtn'), target=parseInt($('exportRes').value,10);
  // lock the bench: the export pass reads the live layout/colors, so nothing may change mid-export
  const ctrls=[...document.querySelectorAll('input,select,button')].filter(el=>!el.disabled);
  ctrls.forEach(el=>el.disabled=true);
  const unlock=()=>{ ctrls.forEach(el=>el.disabled=false); btn.textContent='Download PNG'; };
  btn.textContent='Rendering…';
  try{
    const S=target/CANVAS_W;                       // same seeded artwork, scaled to print resolution
    const p2=params();
    const off=document.createElement('canvas');
    off.width=Math.round(curW*S); off.height=Math.round(curH*S);
    const c2=off.getContext('2d');
    c2.scale(S,S);
    const finishExport=()=>{                       // runs when the chunked paint completes
      const stem=`mosaic_${seed}${paintNo?'_'+paintNo:''}`;
      const meta=settingsJSON();                   // recipe captured before any download starts
      const dl=(b,name)=>{ b.arrayBuffer().then(ab=>{
        // stamp the settings into the PNG itself; fall back to the plain file if anything goes wrong
        let out=b;
        try{ out=new Blob([pngAddText(new Uint8Array(ab),META_KEY,meta)],{type:'image/png'}); }catch(e){}
        const a=document.createElement('a');
        a.download=name; a.href=URL.createObjectURL(out); a.click();
        setTimeout(()=>URL.revokeObjectURL(a.href),10000);
      }); };
      const tooBig=()=>alert('Export failed — the canvas was too large for this browser. Try a smaller print size.');
      if(p2.split && p2.panels>=2){
        // one file per panel, cut on the same seams, exact pixels and no rescaling
        const S2=off.width/curW;
        const xs=panelXs(curW,p2).map(v=>Math.round(v*S2));
        const nP=xs.length-1;
        let doneN=0, failed=0;
        for(let k=0;k<nP;k++){
          const pw=xs[k+1]-xs[k];
          const pc=document.createElement('canvas'); pc.width=pw; pc.height=off.height;
          pc.getContext('2d').drawImage(off, xs[k],0,pw,off.height, 0,0,pw,off.height);
          pc.toBlob(b=>{
            if(b) dl(b,`${stem}_panel${k+1}_${target}px.png`); else failed++;
            if(++doneN===nP){ if(failed) tooBig(); unlock(); }
          },'image/png');
        }
      }else{
        off.toBlob(b=>{
          if(b) dl(b,`${stem}_${target}px.png`); else tooBig();
          unlock();
        },'image/png');
      }
    };
    paintChunked(c2,p2,finishExport);              // time-sliced: the tab stays live during big exports
  }catch(e){ unlock(); throw e; }
});

syncBrush();
syncPanels();
rebuild();
</script>
